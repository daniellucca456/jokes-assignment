<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>Assignment on Jokes</title>
</head>

<body class="bg-blue-200 min-h-screen flex items-center justify-center p-4 sm:p-6 font:[Poppins]">

  <!-- Joke Card -->
  <div class="bg-gray-500 w-full max-w-md rounded-2xl p-6 sm:p-8 md:p-10 text-center shadow-lg">

    <h1 class="text-white text-2xl sm:text-3xl font-bold">
      Random Jokes 🤣
    </h1>

    <p id="joke" class="text-white text-base sm:text-lg leading-relaxed mt-6 min-h-[80px] flex items-center justify-center">
      Click the button to get a joke 🤣
    </p>

    <button
      id="jokebtn"
      class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg mt-6 w-full sm:w-auto hover:bg-blue-700 transition"
    >
      Get Joke
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
